version: '3.8'

services:
  api:
    image: olist-crm-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PUBLIC_URL=${PUBLIC_URL}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - OLIST_API_TOKEN=${OLIST_API_TOKEN}
      - OLIST_API_BASE_URL=${OLIST_API_BASE_URL}
      - OLIST_SYNC_START_DATE=${OLIST_SYNC_START_DATE}
      - STARTUP_SYNC_ENABLED=${STARTUP_SYNC_ENABLED:-false}
      - WORKER_OLIST_SYNC_ENABLED=${WORKER_OLIST_SYNC_ENABLED:-true}
      - WORKER_OLIST_SYNC_INTERVAL_MINUTES=${WORKER_OLIST_SYNC_INTERVAL_MINUTES:-60}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - SUPABASE_TABLE_2026=${SUPABASE_TABLE_2026}
      - DROPBOX_ACCESS_TOKEN=${DROPBOX_ACCESS_TOKEN}
      - DROPBOX_REFRESH_TOKEN=${DROPBOX_REFRESH_TOKEN}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET}
      - DROPBOX_CUSTOMER_CREDIT_PATH=${DROPBOX_CUSTOMER_CREDIT_PATH}
      - DROPBOX_CUSTOMER_DEFECT_PATH=${DROPBOX_CUSTOMER_DEFECT_PATH:-/DEFEITOS - XP}
      - HISTORICAL_FILES=${HISTORICAL_FILES}
      - CUSTOMER_CREDIT_WORKBOOK_DIR=${CUSTOMER_CREDIT_WORKBOOK_DIR}
      - CUSTOMER_CREDIT_WORKBOOK_PREFIX=${CUSTOMER_CREDIT_WORKBOOK_PREFIX}
      - CUSTOMER_DEFECT_WORKBOOK_DIR=${CUSTOMER_DEFECT_WORKBOOK_DIR}
      - CUSTOMER_DEFECT_WORKBOOK_PREFIX=${CUSTOMER_DEFECT_WORKBOOK_PREFIX:-坏品表 PLANILHA DEFEITOS 2026}
      - WORKER_DEFECT_SYNC_ENABLED=${WORKER_DEFECT_SYNC_ENABLED:-true}
      - WORKER_DEFECT_SYNC_HOUR=${WORKER_DEFECT_SYNC_HOUR:-5}
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - WORKER_WHATSAPP_WEBHOOK_WATCHDOG_ENABLED=${WORKER_WHATSAPP_WEBHOOK_WATCHDOG_ENABLED:-true}
      - WORKER_WHATSAPP_WEBHOOK_WATCHDOG_INTERVAL_MINUTES=${WORKER_WHATSAPP_WEBHOOK_WATCHDOG_INTERVAL_MINUTES:-1}
      - WHATSAPP_DISCONNECT_ALERT_ENABLED=${WHATSAPP_DISCONNECT_ALERT_ENABLED:-true}
      - WHATSAPP_DISCONNECT_ALERT_GROUP_JID=${WHATSAPP_DISCONNECT_ALERT_GROUP_JID:-120363025402961504@g.us}
      - WHATSAPP_DISCONNECT_ALERT_INSTANCE_ID=${WHATSAPP_DISCONNECT_ALERT_INSTANCE_ID:-}
      - WHATSAPP_DISCONNECT_ALERT_TIMEZONE=${WHATSAPP_DISCONNECT_ALERT_TIMEZONE:-America/Sao_Paulo}
      - OFFBOARDING_ALERT_ENABLED=${OFFBOARDING_ALERT_ENABLED:-false}
      - OFFBOARDING_ALERT_GROUP_JID=${OFFBOARDING_ALERT_GROUP_JID:-120363425564890886@g.us}
      - OFFBOARDING_ALERT_HOUR=${OFFBOARDING_ALERT_HOUR:-8}
      - OFFBOARDING_ALERT_TIMEZONE=${OFFBOARDING_ALERT_TIMEZONE:-America/Sao_Paulo}
      - OFFBOARDING_ALERT_INSTANCE_ID=${OFFBOARDING_ALERT_INSTANCE_ID:-}
      - LIFECYCLE_AUTOMATION_ENABLED=${LIFECYCLE_AUTOMATION_ENABLED:-false}
      - LIFECYCLE_SIMULATION_ONLY=${LIFECYCLE_SIMULATION_ONLY:-true}
      - LIFECYCLE_AUTOMATION_HOUR=${LIFECYCLE_AUTOMATION_HOUR:-9}
      - LIFECYCLE_AUTOMATION_TIMEZONE=${LIFECYCLE_AUTOMATION_TIMEZONE:-America/Sao_Paulo}
      - LIFECYCLE_AUTOMATION_INSTANCE_ID=${LIFECYCLE_AUTOMATION_INSTANCE_ID:-}
      - LIFECYCLE_HANDOFF_GROUP_JID=${LIFECYCLE_HANDOFF_GROUP_JID:-}
      - WHATSAPP_GROUPS_SHEET_CSV_URL=${WHATSAPP_GROUPS_SHEET_CSV_URL}
      - WHATSAPP_MIN_DELAY_SECONDS=${WHATSAPP_MIN_DELAY_SECONDS}
      - WHATSAPP_MAX_DELAY_SECONDS=${WHATSAPP_MAX_DELAY_SECONDS}
      - WHATSAPP_RECENT_CONTACT_BLOCK_DAYS=${WHATSAPP_RECENT_CONTACT_BLOCK_DAYS}
      - INVENTORY_SHEET_SOURCE_NAME=${INVENTORY_SHEET_SOURCE_NAME}
      - INVENTORY_SHEET_CSV_URL=${INVENTORY_SHEET_CSV_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - META_ADS_ACCESS_TOKEN=${META_ADS_ACCESS_TOKEN}
      - META_ADS_ACCOUNT_ID=${META_ADS_ACCOUNT_ID}
      - META_ADS_API_VERSION=${META_ADS_API_VERSION}
      - META_ADS_CURRENCY=${META_ADS_CURRENCY}
      - META_ADS_TIMEZONE=${META_ADS_TIMEZONE}
      - META_ADS_INVOICE_SUMMARY_PATH=${META_ADS_INVOICE_SUMMARY_PATH}
      - PROSPECTING_DAILY_TARGET=${PROSPECTING_DAILY_TARGET}
      - PROSPECTING_SEARCH_PAGE_SIZE=${PROSPECTING_SEARCH_PAGE_SIZE}
      - PROSPECTING_SNAPSHOT_CACHE_HOURS=${PROSPECTING_SNAPSHOT_CACHE_HOURS}
      - PROSPECTING_DETAIL_CACHE_HOURS=${PROSPECTING_DETAIL_CACHE_HOURS}
      - PROSPECTING_TEXT_SEARCH_DAILY_LIMIT=${PROSPECTING_TEXT_SEARCH_DAILY_LIMIT}
      - PROSPECTING_TEXT_SEARCH_MONTHLY_LIMIT=${PROSPECTING_TEXT_SEARCH_MONTHLY_LIMIT}
      - PROSPECTING_PLACE_DETAILS_DAILY_LIMIT=${PROSPECTING_PLACE_DETAILS_DAILY_LIMIT}
      - PROSPECTING_PLACE_DETAILS_MONTHLY_LIMIT=${PROSPECTING_PLACE_DETAILS_MONTHLY_LIMIT}
      - PROSPECTING_TIMEZONE=${PROSPECTING_TIMEZONE}
    depends_on:
      - xpcrm_redis
    volumes:
      - campaign-media:/app/apps/api/uploads/campaign-media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  worker:
    image: olist-crm-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "start:worker", "-w", "@olist-crm/api"]
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - OLIST_API_TOKEN=${OLIST_API_TOKEN}
      - OLIST_API_BASE_URL=${OLIST_API_BASE_URL}
      - OLIST_SYNC_START_DATE=${OLIST_SYNC_START_DATE}
      - STARTUP_SYNC_ENABLED=${STARTUP_SYNC_ENABLED:-false}
      - WORKER_OLIST_SYNC_ENABLED=${WORKER_OLIST_SYNC_ENABLED:-true}
      - WORKER_OLIST_SYNC_INTERVAL_MINUTES=${WORKER_OLIST_SYNC_INTERVAL_MINUTES:-60}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - SUPABASE_TABLE_2026=${SUPABASE_TABLE_2026}
      - DROPBOX_ACCESS_TOKEN=${DROPBOX_ACCESS_TOKEN}
      - DROPBOX_REFRESH_TOKEN=${DROPBOX_REFRESH_TOKEN}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET}
      - DROPBOX_CUSTOMER_CREDIT_PATH=${DROPBOX_CUSTOMER_CREDIT_PATH}
      - DROPBOX_CUSTOMER_DEFECT_PATH=${DROPBOX_CUSTOMER_DEFECT_PATH:-/DEFEITOS - XP}
      - HISTORICAL_FILES=${HISTORICAL_FILES}
      - CUSTOMER_CREDIT_WORKBOOK_DIR=${CUSTOMER_CREDIT_WORKBOOK_DIR}
      - CUSTOMER_CREDIT_WORKBOOK_PREFIX=${CUSTOMER_CREDIT_WORKBOOK_PREFIX}
      - CUSTOMER_DEFECT_WORKBOOK_DIR=${CUSTOMER_DEFECT_WORKBOOK_DIR}
      - CUSTOMER_DEFECT_WORKBOOK_PREFIX=${CUSTOMER_DEFECT_WORKBOOK_PREFIX:-坏品表 PLANILHA DEFEITOS 2026}
      - WORKER_DEFECT_SYNC_ENABLED=${WORKER_DEFECT_SYNC_ENABLED:-true}
      - WORKER_DEFECT_SYNC_HOUR=${WORKER_DEFECT_SYNC_HOUR:-5}
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - WORKER_WHATSAPP_WEBHOOK_WATCHDOG_ENABLED=${WORKER_WHATSAPP_WEBHOOK_WATCHDOG_ENABLED:-true}
      - WORKER_WHATSAPP_WEBHOOK_WATCHDOG_INTERVAL_MINUTES=${WORKER_WHATSAPP_WEBHOOK_WATCHDOG_INTERVAL_MINUTES:-1}
      - WHATSAPP_DISCONNECT_ALERT_ENABLED=${WHATSAPP_DISCONNECT_ALERT_ENABLED:-true}
      - WHATSAPP_DISCONNECT_ALERT_GROUP_JID=${WHATSAPP_DISCONNECT_ALERT_GROUP_JID:-120363025402961504@g.us}
      - WHATSAPP_DISCONNECT_ALERT_INSTANCE_ID=${WHATSAPP_DISCONNECT_ALERT_INSTANCE_ID:-}
      - WHATSAPP_DISCONNECT_ALERT_TIMEZONE=${WHATSAPP_DISCONNECT_ALERT_TIMEZONE:-America/Sao_Paulo}
      - OFFBOARDING_ALERT_ENABLED=${OFFBOARDING_ALERT_ENABLED:-false}
      - OFFBOARDING_ALERT_GROUP_JID=${OFFBOARDING_ALERT_GROUP_JID:-120363425564890886@g.us}
      - OFFBOARDING_ALERT_HOUR=${OFFBOARDING_ALERT_HOUR:-8}
      - OFFBOARDING_ALERT_TIMEZONE=${OFFBOARDING_ALERT_TIMEZONE:-America/Sao_Paulo}
      - OFFBOARDING_ALERT_INSTANCE_ID=${OFFBOARDING_ALERT_INSTANCE_ID:-}
      - LIFECYCLE_AUTOMATION_ENABLED=${LIFECYCLE_AUTOMATION_ENABLED:-false}
      - LIFECYCLE_SIMULATION_ONLY=${LIFECYCLE_SIMULATION_ONLY:-true}
      - LIFECYCLE_AUTOMATION_HOUR=${LIFECYCLE_AUTOMATION_HOUR:-9}
      - LIFECYCLE_AUTOMATION_TIMEZONE=${LIFECYCLE_AUTOMATION_TIMEZONE:-America/Sao_Paulo}
      - LIFECYCLE_AUTOMATION_INSTANCE_ID=${LIFECYCLE_AUTOMATION_INSTANCE_ID:-}
      - LIFECYCLE_HANDOFF_GROUP_JID=${LIFECYCLE_HANDOFF_GROUP_JID:-}
      - WHATSAPP_GROUPS_SHEET_CSV_URL=${WHATSAPP_GROUPS_SHEET_CSV_URL}
      - WHATSAPP_MIN_DELAY_SECONDS=${WHATSAPP_MIN_DELAY_SECONDS}
      - WHATSAPP_MAX_DELAY_SECONDS=${WHATSAPP_MAX_DELAY_SECONDS}
      - WHATSAPP_RECENT_CONTACT_BLOCK_DAYS=${WHATSAPP_RECENT_CONTACT_BLOCK_DAYS}
      - INVENTORY_SHEET_SOURCE_NAME=${INVENTORY_SHEET_SOURCE_NAME}
      - INVENTORY_SHEET_CSV_URL=${INVENTORY_SHEET_CSV_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - META_ADS_ACCESS_TOKEN=${META_ADS_ACCESS_TOKEN}
      - META_ADS_ACCOUNT_ID=${META_ADS_ACCOUNT_ID}
      - META_ADS_API_VERSION=${META_ADS_API_VERSION}
      - META_ADS_CURRENCY=${META_ADS_CURRENCY}
      - META_ADS_TIMEZONE=${META_ADS_TIMEZONE}
      - META_ADS_INVOICE_SUMMARY_PATH=${META_ADS_INVOICE_SUMMARY_PATH}
      - PROSPECTING_DAILY_TARGET=${PROSPECTING_DAILY_TARGET}
      - PROSPECTING_SEARCH_PAGE_SIZE=${PROSPECTING_SEARCH_PAGE_SIZE}
      - PROSPECTING_SNAPSHOT_CACHE_HOURS=${PROSPECTING_SNAPSHOT_CACHE_HOURS}
      - PROSPECTING_DETAIL_CACHE_HOURS=${PROSPECTING_DETAIL_CACHE_HOURS}
      - PROSPECTING_TEXT_SEARCH_DAILY_LIMIT=${PROSPECTING_TEXT_SEARCH_DAILY_LIMIT}
      - PROSPECTING_TEXT_SEARCH_MONTHLY_LIMIT=${PROSPECTING_TEXT_SEARCH_MONTHLY_LIMIT}
      - PROSPECTING_PLACE_DETAILS_DAILY_LIMIT=${PROSPECTING_PLACE_DETAILS_DAILY_LIMIT}
      - PROSPECTING_PLACE_DETAILS_MONTHLY_LIMIT=${PROSPECTING_PLACE_DETAILS_MONTHLY_LIMIT}
      - PROSPECTING_TIMEZONE=${PROSPECTING_TIMEZONE}
    depends_on:
      - xpcrm_redis
    volumes:
      - campaign-media:/app/apps/api/uploads/campaign-media
    restart: always

  xpcrm_redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data:
  campaign-media:
